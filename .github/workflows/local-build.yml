# Hayya – Expo'suz derleme: GitHub sunucusunda Play Store dosyası (AAB) ve telefona kurulacak APK üretir.
# İkisi de kendi imza anahtarımızla (ANDROID_KEYSTORE_*) imzalanır; derleme sayfasında "Artifacts" altından indirilir.
name: Kendi sunucumuzda derle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          node scripts/pin-deps.js
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: İmza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hayya.jks"

      - name: Derle (AAB + APK)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          cd android
          set +e
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/hayya.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASS" > gradle.log 2>&1
          r=$?
          grep -E '^e: |What went wrong|BUILD' gradle.log | head -40
          [ $r -ne 0 ] && tail -60 gradle.log
          exit $r

      - name: İmzayı doğrula ve dosyaları adlandır
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          VC=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          VN=$(node -e "console.log(require('./app.json').expo.version)")
          echo "VC=$VC" >> $GITHUB_ENV; echo "VN=$VN" >> $GITHUB_ENV
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/hayya-$VC.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/hayya-$VC.apk"
          WANT=$(keytool -list -v -keystore "$RUNNER_TEMP/hayya.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -m1 'SHA256:' | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile "out/hayya-$VC.aab" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Anahtar: $WANT"; echo "AAB imza: $GOT"
          if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then echo "İMZA UYUŞMUYOR"; exit 1; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hayya-${{ env.VC }}
          path: out/
